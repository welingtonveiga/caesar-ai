[project]
name = "caesar-ai"
version = "0.1.0"
description = "A personal AI agent that runs on your own machine and talks to you over a messaging channel (e.g. Telegram)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "httpx>=0.28.1",
    "langchain>=1",
    "langchain-google-genai>=4",
    "langchain-openai>=1",
    "langgraph-checkpoint-sqlite>=3",
    "markdownify>=1.2.3",
    "python-dotenv>=1",
    "python-telegram-bot>=21",
    "pyyaml>=6",
]

[project.scripts]
caesar = "caesar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "caesar"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=caesar",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
